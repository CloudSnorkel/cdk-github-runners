# ~~ Generated by projen. To modify, edit .projenrc.js and run "pnpm exec projen".

name: docs
on:
  workflow_dispatch: {}
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.33.0
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          package-manager-cache: true
      - name: Install dependencies
        id: install_dependencies
        run: pnpm i --frozen-lockfile
      - name: Build docs
        id: build_docs
        run: pnpm exec projen compile && pnpm exec projen docgen && pnpm exec projen docs:build
      - name: Upload docs
        id: upload_docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs
      - name: Deploy docs
        id: deploy
        uses: actions/deploy-pages@v5
