# This tests against providers/labels deployed by test/default.integ.ts
# If you want to run this on your account, you will first have to integration test and set it up to point to your fork.

name: integ-all-providers

on:
  workflow_dispatch:
  workflow_call:

jobs:
  self-hosted:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codebuild x64
            os: linux
            arch: X64
            runs-on: [self-hosted, codebuild-x64]
            docker: true
            sudo: true
            # test for https://github.com/CloudSnorkel/cdk-github-runners/issues/380
            environment: env-test
          - name: codebuild ubuntu 2404 x64
            os: linux
            arch: X64
            runs-on: [self-hosted, codebuild-ubuntu-2404-x64]
            docker: true
            sudo: true
            # test for https://github.com/CloudSnorkel/cdk-github-runners/issues/380
            environment: env-test
          - name: codebuild arm64
            os: linux
            arch: ARM64
            runs-on: [self-hosted, linux, codebuild, arm64]
            docker: true
            sudo: true
          - name: ecs x64
            os: linux
            arch: X64
            runs-on: [self-hosted, linux, ecs, X64]
            docker: true
            sudo: true
            imds: blocked
          - name: ecs ubuntu 2404 x64
            os: linux
            arch: X64
            runs-on: [self-hosted, ecs-ubuntu-2404, X64]
            docker: true
            sudo: true
            imds: blocked
          - name: ecs arm64
            os: linux
            arch: ARM64
            runs-on: [self-hosted, linux, ecs, arm64]
            docker: true
            sudo: true
            imds: blocked
          - name: lambda x64
            os: linux
            arch: X64
            runs-on: [self-hosted, lambda, x64]
            docker: false
            sudo: false
            no-python: true # Amazon Linux, and setup-python only has builds for Ubuntu
          - name: lambda arm64
            os: linux
            arch: ARM64
            runs-on: [self-hosted, lambda, arm64]
            docker: false
            sudo: false
            no-python: true # Amazon Linux, and setup-python only has builds for Ubuntu
          - name: fargate x64
            os: linux
            arch: X64
            runs-on: [self-hosted, linux, fargate, x64]
            docker: false
            sudo: true
          - name: fargate arm64
            os: linux
            arch: ARM64
            runs-on: [self-hosted, linux, fargate, arm64]
            docker: false
            sudo: true
          - name: fargate x64 (spot)
            os: linux
            arch: X64
            runs-on: [self-hosted, linux, fargate-spot, x64]
            docker: false
            sudo: true
          - name: fargate arm64 (spot)
            os: linux
            arch: ARM64
            runs-on: [self-hosted, linux, fargate-spot, arm64]
            docker: false
            sudo: true
          - name: ec2 x64
            os: linux
            arch: X64
            runs-on: [self-hosted, linux, ec2, x64]
            docker: true
            sudo: true
          - name: ec2 x64 (spot)
            os: linux
            arch: X64
            runs-on: [self-hosted, linux, ec2-spot, x64]
            docker: true
            sudo: true
          - name: ec2 arm64
            os: linux
            arch: ARM64
            runs-on: [self-hosted, linux, ec2, arm64]
            docker: true
            sudo: true

    name: ${{ matrix.name }}
    environment: ${{ matrix.environment }}

    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - run: export | grep -v KEY | grep -v TOKEN
      - name: Check arch
        run: |
          if [ "${{ matrix.arch }}" != "${RUNNER_ARCH}" ]; then
            echo "Expected \$RUNNER_ARCH to be '${{ matrix.arch }}' but it's '$RUNNER_ARCH'"
            exit 1
          fi
      - name: Check env
        run: |
          if [ "$HELLO" != "world" ]; then
            echo "Expected '\$HELLO' to be 'world' but it's '$HELLO'"
            exit 1
          fi
          if [ "$FOO" != "bar" ]; then
            echo "Expected '\$FOO' to be 'bar' but it's '$FOO'"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - run: ls -lah
      - run: sudo ls -lah
        if: ${{ matrix.sudo }}
      - name: github script
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("hello world");
      - name: git
        run: git --version
      - name: aws
        run: |
          aws --version
          aws sts get-caller-identity
      - name: gh
        run: gh --version
      - name: docker
        if: ${{ matrix.docker }}
        run: |
          echo FROM public.ecr.aws/docker/library/hello-world > Dockerfile
          docker build  .
          docker-compose --version
          docker compose version
      - name: custom files
        run: |
          ls /custom-file
          ls /custom-dir/FUNDING.yml
      - name: write home
        run: touch "$HOME/integ-write-test" "$RUNNER_TEMP/integ-write-test"
      - name: cache
        uses: actions/cache@v5
        with:
          path: integ-cache
          key: integ-${{ matrix.name }}
      - run: mkdir -p integ-cache && date > integ-cache/stamp
      - name: setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: node --version
      - name: setup-python
        if: ${{ !matrix.no-python }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python --version
        if: ${{ !matrix.no-python }}
      - name: IMDS blocked
        if: ${{ matrix.imds == 'blocked' }}
        run: |
          # jobs must not be able to get the instance role of a host they share with other jobs
          if TOKEN=$(curl -sS -f -m 5 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60"); then
            echo "::add-mask::$TOKEN"
            ROLE=$(curl -sS -f -m 5 -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/ || true)
            echo "::error::Job reached IMDS and can get the host instance role ($ROLE)"
            exit 1
          fi
          echo "IMDS is not reachable"

  self-hosted-dind:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codebuild dind
            runs-on: [ self-hosted, codebuild-x64 ]
          - name: ecs dind
            runs-on: [ self-hosted, linux, ecs, x64 ]
          - name: ec2 dind
            runs-on: [ self-hosted, linux, ec2, x64 ]

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    container: ghcr.io/github/super-linter  # this makes it a docker-in-docker container
    steps:
      - name: Checkout
        uses: actions/checkout@v7

  self-hosted-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codebuild windows
            os: windows
            arch: X64
            runs-on: [self-hosted, windows, codebuild, x64]
            docker: false
          - name: ecs windows
            os: windows
            arch: X64
            runs-on: [self-hosted, windows, ecs, x64]
            docker: false
            imds: blocked
          - name: fargate windows
            os: windows
            arch: X64
            runs-on: [self-hosted, windows, fargate, x64]
            docker: false
          - name: ec2 windows
            os: windows
            arch: X64
            runs-on: [self-hosted, windows, ec2, x64]
            docker: true

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - run: |
          Get-ChildItem Env: | Where-Object { $_.Name -notmatch 'KEY|TOKEN' }
      - name: Check arch
        run: |
          if (Compare-Object "${{ matrix.arch }}" $Env:RUNNER_ARCH) {
            Write-Host "Expected `$Env:RUNNER_ARCH to be '${{ matrix.arch }}' but it's '$Env:RUNNER_ARCH'"
            exit 1
          }
      - name: Check env
        run: |
          if (Compare-Object "$Env:HELLO" world) {
            Write-Host "Expected `$Env:HELLO to be 'world' but it's '$Env:HELLO'"
            exit 1
          }
          if (Compare-Object "$Env:FOO" bar) {
            Write-Host "Expected `$Env:FOO to be 'bar' but it's '$Env:FOO'"
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: ls
        run: |
          $ErrorActionPreference = 'Stop'
          ls
      - name: github script
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("hello world");
      - name: git
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
      - name: aws
        run: |
          $ErrorActionPreference = 'Stop'
          aws --version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
          aws sts get-caller-identity
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
      - name: gh
        run: |
          $ErrorActionPreference = 'Stop'
          gh --version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
      - name: docker
        if: ${{ matrix.docker }}
        run: |
          $ErrorActionPreference = 'Stop'
          echo "FROM public.ecr.aws/docker/library/hello-world" | Out-File -Encoding ASCII Dockerfile
          docker build  .
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
          docker-compose --version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
      - name: custom files
        run: |
          $ErrorActionPreference = 'Stop'
          ls /custom-file
          ls /custom-dir/FUNDING.yml
      - name: write home
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType File "$Env:USERPROFILE/integ-write-test", "$Env:RUNNER_TEMP/integ-write-test"
      - name: cache
        uses: actions/cache@v5
        with:
          path: integ-cache
          key: integ-${{ matrix.name }}
      - run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force integ-cache
          Get-Date | Out-File integ-cache/stamp
      - name: setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: |
          $ErrorActionPreference = 'Stop'
          node --version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
      - name: setup-python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: |
          $ErrorActionPreference = 'Stop'
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Exit code is $LASTEXITCODE" }
      - name: IMDS blocked
        if: ${{ matrix.imds == 'blocked' }}
        run: |
          # jobs must not be able to get the instance role of a host they share with other jobs
          try {
            $token = Invoke-RestMethod -Method PUT -Uri http://169.254.169.254/latest/api/token -Headers @{"X-aws-ec2-metadata-token-ttl-seconds"="60"} -TimeoutSec 5
          } catch {
            Write-Host "IMDS is not reachable"
            exit 0
          }
          Write-Host "::add-mask::$token"
          try {
            $role = Invoke-RestMethod -Uri http://169.254.169.254/latest/meta-data/iam/security-credentials/ -Headers @{"X-aws-ec2-metadata-token"=$token} -TimeoutSec 5
          } catch {
            $role = ""
          }
          Write-Host "::error::Job reached IMDS and can get the host instance role ($role)"
          exit 1
